<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>工作树与分支</title><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; connect-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/hana-card-style.css"><script type="application/json" data-card-manifest>{"spec":"1.0","display":{"styleProfile":"custom"},"packageAssets":["assets/hana-card-style.css","assets/worktrees-hero.jpg"],"stateSchema":{"type":"object","properties":{"uiLanguage":{"type":"string"},"model":{"type":"object"}}},"toolBindings":{}}</script><script type="application/json" data-card-state>{"uiLanguage":"zh","model":{"repoPath":"","repoLabel":"示例仓库 · 未绑定","at":"","rows":[{"id":"example-main","branch":"main","head":"示例","status":"","commits":"","upstream":""}],"summaries":{"example-main":"主线开发与集成工作区（示例）。"},"phase":"idle","refreshId":null,"message":"请先用配方准备脚本读取目标仓库。"}}</script><style>html,body{margin:0;width:100%;min-width:0}.hs-page{width:100%;min-width:0;height:570px;background:var(--hs-bg);color:var(--hs-ink);font-family:var(--hs-sans)}.hs-shell{--hc-pad:clamp(10px,3.2vw,22px);width:100%;max-width:none;min-width:0;height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:48px clamp(10px,3.2vw,22px) 20px}.heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 12px;position:relative;isolation:isolate;z-index:2;margin-bottom:0}.heading .stats{flex-basis:100%;margin:8px 0 0}.heading:before{content:'';position:absolute;left:calc(6px - var(--hc-pad));right:calc(6px - var(--hc-pad));top:-42px;bottom:-8px;z-index:-1;background:url('assets/worktrees-hero.jpg') center 55%/cover;border-radius:calc(8px * var(--hana-corner-radius-scale,1));corner-shape:squircle;pointer-events:none}.hs-title{font-size:22px!important;color:#F7F5EE!important}.repo{font-size:12px;color:#D9DFDF;overflow-wrap:anywhere}.sub,.status,.brand{font-size:11px;color:var(--hs-muted);line-height:1.7;overflow-wrap:anywhere}.sub{margin-top:5px!important}.stats{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.pages{flex:1;min-height:0;overflow:auto;min-width:0;position:relative;z-index:1;box-sizing:border-box;padding-top:14px;width:calc(100% + var(--hc-pad) + var(--hc-pad) - 20px);margin-left:calc(10px - var(--hc-pad))}.map{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}.entry{width:100%;min-width:0;text-align:left;background:var(--hs-soft);border:1px solid var(--hs-line);border-radius:var(--hs-radius);padding:8px 12px;cursor:pointer;color:var(--hs-ink)}.entry:hover{border-color:var(--hs-accent)}.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}.branch{flex:1 1 160px;min-width:0;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;color:var(--hs-accent)}.summary{font-size:12.5px;line-height:1.65;color:var(--hs-sub);margin-top:4px!important;overflow-wrap:anywhere}.entry .hs-badge{font-size:10px;white-space:normal}.group{border:1px solid var(--hs-line);border-radius:var(--hs-radius);padding:12px;background:var(--hs-soft)}.line{font-size:12px;line-height:1.8;margin-top:12px!important;white-space:pre-wrap;overflow-wrap:anywhere}.foot{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin-top:14px}.pager{grid-column:2;display:flex;align-items:center;gap:8px}.dots{display:flex;gap:7px;max-width:120px;overflow:auto;padding:4px}.dot{width:8px;height:8px;flex:none;border:0;border-radius:50%;padding:0;background:var(--hs-accent);opacity:.4;cursor:pointer}.dot.on{opacity:1;outline:1px solid var(--hs-accent);outline-offset:2px}.dot.home{width:10px;height:10px;background:transparent;color:var(--hs-muted);opacity:.65;border-radius:0;display:inline-flex;align-items:center;justify-content:center}.dot.home.on{outline:none;color:var(--hs-ink);opacity:1}.dot.home svg{width:10px;height:10px;overflow:visible;transform:translateY(-1px)}.home .home-shape{fill:currentColor;stroke:currentColor;stroke-width:.5;stroke-linejoin:round}.home .home-ring,.home .home-gap{fill:none;stroke-linejoin:round;display:none}.home.on .home-ring{display:block;stroke:currentColor;stroke-width:7}.home.on .home-gap{display:block;stroke:var(--hs-bg);stroke-width:4}.arrow{padding:2px 7px!important}#refresh{grid-column:3;justify-self:end;white-space:normal;font-size:12px}#refresh.busy{background:var(--hs-soft);color:var(--hs-muted);border-color:var(--hs-line);cursor:wait}#refresh.busy:before{content:'';display:inline-block;width:9px;height:9px;border:1px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:6px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.updated{grid-column:1;font-size:11px;color:var(--hs-muted);white-space:nowrap}.status{margin-top:8px!important;min-height:0}.status:empty{display:none}.brand{text-align:center;margin-top:5px!important}.hs-textarea{margin-top:12px;font-size:12px!important}@media(max-width:500px){.foot{grid-template-columns:minmax(0,1fr)}.updated{grid-column:1;justify-self:center}.pager{grid-column:1;justify-self:center}#refresh{grid-column:1;justify-self:center}.hs-shell{padding-top:44px}.heading:before{top:-38px}.branch{flex-basis:100%}}@media(prefers-reduced-motion:reduce){#refresh.busy:before{animation:none}}</style></head><body><main class="hs-page"><div class="hs-shell"><header class="heading"><h1 class="hs-title">工作树与分支</h1><span class="repo" id="repoLabel">示例仓库</span><div class="stats" id="stats"></div></header><section class="pages" id="pages"></section><footer class="foot"><time class="updated" id="updated"></time><div class="pager"><button class="hs-button hs-button--quiet arrow" id="prev" aria-label="上一页">‹</button><span class="dots" id="dots"></span><button class="hs-button hs-button--quiet arrow" id="next" aria-label="下一页">›</button></div><button class="hs-button hs-button--primary" id="refresh" disabled>刷新</button></footer><p class="status" id="status" role="status"></p><button class="hs-button hs-button--quiet" id="cancel" hidden>取消本次刷新</button><p class="brand">HANA CODER · WORKTREES</p></div></main><script>
const initial=JSON.parse(document.querySelector('[data-card-state]').textContent);
const declaration=JSON.parse(document.querySelector('[data-card-manifest]').textContent);
let model=initial.model,selected=null,caps={},store=Promise.resolve(),ready=false;
const $=id=>document.getElementById(id);function el(t,c,v){const e=document.createElement(t);if(c)e.className=c;if(v!==undefined)e.textContent=v;return e}
function persist(){if(!['available','local_fallback'].includes(caps.state))return Promise.resolve(false);model.selected=selected;const copy=JSON.parse(JSON.stringify(model));const next=store.then(async()=>{const r=await window.card.state.set('model',copy);if(!r.ok)throw Error(r.error||'保存失败');return true});store=next.catch(()=>{});return next.catch(e=>{model.message='状态保存失败：'+e.message;$('status').textContent=model.message;return false})}
function formatTime(value,now=new Date()){const d=new Date(value);if(Number.isNaN(d.getTime()))return '';const hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');const same=d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();return (same?'':(d.getMonth()+1)+'月'+d.getDate()+'日 ')+hh+':'+mm}
function draw(){const busy=model.phase==='scan'||model.phase==='agent';$('repoLabel').textContent=model.repoLabel||'仓库未绑定';$('cancel').hidden=model.phase!=='agent';$('refresh').disabled=busy||!ready||!declaration.toolBindings?.scan||caps.invoke!=='available'||caps.emit!=='available';$('refresh').classList.toggle('busy',busy);$('refresh').textContent=busy?'正在刷新…':'刷新';$('refresh').setAttribute('aria-busy',String(busy));$('updated').textContent=formatTime(model.at);$('updated').dateTime=model.at;$('updated').setAttribute('aria-label','更新时间 '+formatTime(model.at));$('status').textContent=(model.message||'').startsWith('已更新')?'':(model.message||'');$('stats').replaceChildren(el('span','hs-badge hs-badge--pending',model.rows.length+' 个工作树'),el('span','hs-badge hs-badge--good',model.rows.filter(r=>!r.error&&!r.status).length+' 个干净'));if(selected&&!model.rows.some(r=>r.id===selected))selected=null;const area=$('pages');area.replaceChildren();if(!selected){const map=el('div','map');model.rows.forEach(r=>{const b=el('button','entry');b.type='button';const top=el('div','top');top.append(el('span','branch',r.branch),el('span','hs-badge '+((r.error||r.status)?'hs-badge--warn':'hs-badge--good'),r.error?'读取失败':r.status?'有改动':'干净'));b.append(top,el('p','summary',model.summaries[r.id]||'简介待补充'));b.onclick=()=>{selected=r.id;draw();persist()};map.append(b)});area.append(map)}else{const r=model.rows.find(r=>r.id===selected),g=el('section','group');g.append(el('p','branch',r.branch),el('p','summary',model.summaries[r.id]||'简介待补充'));for(const [k,v] of [['目录',r.id],['提交',r.head],['上游',r.upstream||'未设置上游'],['改动',r.error||r.status||'无未提交文件'],['近期提交',r.commits||'首次快照未收录']])g.append(el('p','line',k+'\n'+v));area.append(g)}const idx=selected?model.rows.findIndex(r=>r.id===selected)+1:0;$('dots').replaceChildren();[null,...model.rows.map(r=>r.id)].forEach((id,i)=>{const b=el('button','dot'+(i===0?' home':'')+(i===idx?' on':''));b.setAttribute('aria-label',i?'工作树 '+model.rows[i-1].branch:'总览');if(i===0){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M4 9.5 9 4Q12 .8 15 4L20 9.5Q22 11.5 22 14V17Q22 22 17 22H7Q2 22 2 17V14Q2 11.5 4 9.5Z');const ring=path.cloneNode();ring.setAttribute('class','home-ring');const gap=path.cloneNode();gap.setAttribute('class','home-gap');path.setAttribute('class','home-shape');svg.append(ring,gap,path);b.append(svg);}b.onclick=()=>{selected=id;draw();persist()};$('dots').append(b)});$('prev').disabled=idx===0;$('next').disabled=idx===model.rows.length}
function step(d){const ids=[null,...model.rows.map(r=>r.id)],i=ids.indexOf(selected);selected=ids[Math.max(0,Math.min(ids.length-1,i+d))];draw();persist()}
function accept(data){if(!data||(data.kind&&data.kind!=='worktree-enrich')||data.refreshId!==model.refreshId||model.phase!=='agent')return;if(data.phase!=='done'&&data.phase!=='error')return;if(data.phase==='done'){for(const r of model.rows){const text=data.summaries&&data.summaries[r.id];if(typeof text!=='string') {model.phase='idle';model.message='简介返回不完整，请重新刷新。';draw();persist();return;}}model.summaries=Object.fromEntries(model.rows.map(r=>[r.id,data.summaries[r.id]]));model.message='';}else model.message=data.error||'Agent 补充失败；工作树事实已保留。';model.phase='idle';draw();persist()}
function extract(result){const texts=[];function walk(x){if(typeof x==='string')texts.push(x);else if(Array.isArray(x))x.forEach(walk);else if(x&&typeof x==='object')Object.values(x).forEach(walk)}walk(result);const text=texts.find(t=>t.includes('HANA_SNAPSHOT='));if(!text)throw Error('命令未返回完整快照，请重试；当前数据未替换。');const match=text.match(/HANA_SNAPSHOT=(\{[^\n]*\})/);if(!match)throw Error('快照格式不完整');const s=JSON.parse(match[1]);if(!Array.isArray(s.rows)||typeof s.at!=='string')throw Error('快照格式无效');return s}
async function refresh(){if(model.phase!=='idle'||$('refresh').disabled)return;model.refreshId=crypto.randomUUID();model.phase='scan';model.message='正在读取本地工作树…';draw();try{if(!await persist())throw Error('无法保存请求状态');const out=await window.card.invoke('scan');if(!out.ok)throw Error(out.error||'读取失败');const snap=extract(out.result);model.rows=snap.rows;model.at=snap.at;model.summaries=Object.fromEntries(model.rows.filter(r=>model.summaries[r.id]).map(r=>[r.id,model.summaries[r.id]]));model.phase='agent';model.message='条目已更新，Agent 正在补充简介…';draw();if(!await persist())throw Error('无法保存新快照');const sent=await window.card.emit('hana-corder.enrich-worktrees',{repoPath:model.repoPath,refreshId:model.refreshId,instruction:'读取本事件来源卡片 state.model，核对 refreshId。采集已完成，根据 rows 提交/改动补齐每个工作树的一句话用途；仅名称推断要注明，祖先提交不是本分支用途。用 update_card_data 向来源 cardEntityId 写 {kind:"worktree-enrich",refreshId,phase:"done",summaries:{[完整工作树id]:简介}}；失败写同kind/id及phase:"error",error。回复会复位按钮。不改代码，不推送，不删除工作树。'});if(!sent.ok)throw Error(sent.error||'无法请求 Agent')}catch(e){model.phase='idle';model.message='刷新失败：'+e.message;draw();await persist()}}
$('refresh').onclick=refresh;$('cancel').onclick=()=>{model.phase='idle';model.refreshId=null;model.message='已取消等待，可重新刷新；迟到的旧结果不会覆盖此卡。';draw();persist()};$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);draw();
(async()=>{if(!window.card){model.message='离线快照：刷新需要 Hana 宿主。';draw();return}const c=await window.card.capabilities();if(!c.ok){model.message=c.error||'宿主不可用';draw();return}caps=c.result.capabilities;const stateOk=['available','local_fallback'].includes(caps.state);if(stateOk){const s=await window.card.state.get('model');if(!s.ok){model.message=s.error||'状态读取失败';draw();return}if(s.result.value)model=s.result.value;selected=model.selected||null}const dataOk=caps['data.get']&&['available','local_fallback'].includes(caps['data.get'].status);if(!dataOk||!stateOk){model.message='当前宿主仅可查看快照，缺少状态或数据回写能力。';draw();return}const off=window.card.data.onChange(accept);window.addEventListener('pagehide',()=>{if(typeof off==='function')off()},{once:true});const d=await window.card.data.get();if(d.ok)accept(d.result.data);else{model.message=d.error||'数据读取失败';draw();return}if(model.phase==='scan'){model.phase='idle';model.message='上次读取被中断，可以重新刷新。'}if(!declaration.toolBindings?.scan)model.message='当前模板未绑定仓库，请用配方准备脚本生成卡片。';ready=true;draw();await persist()})();
</script></body></html>
