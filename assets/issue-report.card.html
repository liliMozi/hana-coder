    else if (g.status === "rounds") { b.classList.add("hs-badge--good"); b.textContent = T.stRounds(g.rounds || 1); }
    else if (g.status === "failed") { b.classList.add("sw-badge--bad"); b.textContent = T.stFailed; }
    else { b.classList.add("sw-badge--clarify"); b.textContent = T.stClarify; }
    return b;
  }
  function testsBadge(g) {
    var b = el("span", "hs-badge");
    if (g.tests === "passed") { b.classList.add("hs-badge--good"); b.textContent = T.testsPassed; }
    else if (g.tests === "failed") { b.classList.add("hs-badge--warn"); b.textContent = T.testsFailed; }
    else { b.classList.add("hs-badge--pending"); b.textContent = T.testsNone; }
    return b;
  }

  /* ---------- paging ---------- */
  var pageEls = [];
  var dotEls = [];
  function showPage(i) {
    if (!pageEls.length) return;
    page = Math.max(0, Math.min(i, pageEls.length - 1));
    pageEls.forEach(function (p, k) { p.classList.toggle("on", k === page); });
    dotEls.forEach(function (d, k) { d.classList.toggle("on", k === page); });
    persist();
  }

  /* ---------- render ---------- */
  function render() {
    document.querySelector("main.hs-page").classList.toggle("sw-with-hero", snap.hero === true);
    var titleEl = document.getElementById("swTitle");
    titleEl.textContent = snap.title || T.eyebrow;
    document.getElementById("swBrand").textContent = T.eyebrow;
    var subParts = [];
    if (snap.repo) subParts.push(snap.repo);
    if (snap.rangeLabel) subParts.push(snap.rangeLabel);
    if (subParts.length) titleEl.appendChild(el("span", "sw-sub", subParts.join(" · ")));

    var issueCount = 0, approved = 0, failed = 0, clarify = 0;
    groups.forEach(function (g) {
      issueCount += Array.isArray(g.issues) ? g.issues.length : 0;
      if (g.status === "approved" || g.status === "rounds") approved++;
      else if (g.status === "failed") failed++;
      else clarify++;
    });
    var stats = document.getElementById("swStats");
    stats.innerHTML = "";
    stats.appendChild(el("span", "hs-badge hs-badge--pending", T.stats(issueCount, groups.length)));
    if (approved) stats.appendChild(el("span", "hs-badge hs-badge--good", T.statApproved(approved)));
    if (failed) stats.appendChild(el("span", "hs-badge sw-badge--bad", T.statFailed(failed)));
    if (clarify) stats.appendChild(el("span", "hs-badge sw-badge--clarify", T.statClarify(clarify)));

    var wrap = document.getElementById("swPages");
    wrap.innerHTML = "";
    pageEls = [];
    if (!groups.length) wrap.appendChild(el("p", "sw-empty", T.empty));

    groups.forEach(function (g, gi) {
      var isClarify = g.status === "clarify";
      var isFailed = g.status === "failed";
      var pg = el("div", "sw-page");
      var card = el("section", "sw-group" + (isClarify ? " sw-group--clarify" : ""));

      var head = el("div", "sw-ghead");
      var gid = el("div", "sw-gid");
      gid.appendChild(el("span", "sw-worker", g.label || (isClarify ? T.clarifyWorker : "Worker")));
      if (!isClarify) gid.appendChild(statusBadge(g));
      head.appendChild(gid);
      if (g.branch) head.appendChild(el("code", "sw-branch", g.branch));
      card.appendChild(head);

      var body = el("div", "sw-body");
      (Array.isArray(g.issues) ? g.issues : []).forEach(function (it) {
        var block = el("div", "sw-issue");
        var t = el("p", "sw-ititle");
        var num = el("button", "sw-num", "#" + it.number);
        num.type = "button";
        num.addEventListener("click", function () { openDetail(g, it); });
        t.appendChild(num);
        t.appendChild(document.createTextNode(it.title || ""));
        block.appendChild(t);

        if (it.problem) {
          var rp = el("div", "sw-row sw-row--problem");
          rp.appendChild(el("span", "sw-tag", T.tagProblem));
          rp.appendChild(el("p", null, it.problem));
          block.appendChild(rp);
        }
        if (isClarify && it.missing) {
          var rm = el("div", "sw-row sw-row--missing");
          rm.appendChild(el("span", "sw-tag", T.tagMissing));
          rm.appendChild(el("p", null, it.missing));
          block.appendChild(rm);
        } else if (it.solution) {
          var rs = el("div", "sw-row sw-row--solution");
          rs.appendChild(el("span", "sw-tag", T.tagSolution));
          rs.appendChild(el("p", null, it.solution));
          block.appendChild(rs);
        }
        body.appendChild(block);
      });

      if (g.mergeReason) body.appendChild(el("div", "sw-merge", g.mergeReason));
      if (isFailed && g.failReason) body.appendChild(el("div", "sw-fail", g.failReason));
      card.appendChild(body);

      if (!isClarify) {
        var foot = el("div", "sw-gfoot");
        foot.appendChild(el("span", null, T.files(g.filesChanged || 0)));
        foot.appendChild(testsBadge(g));
        if (g.testsNote) foot.appendChild(el("span", null, g.testsNote));
        card.appendChild(foot);
      }

      /* per-group annotation */
      var noteWrap = el("div", "sw-note");
      var ta = el("textarea", "hs-textarea");
      ta.rows = 1;
      ta.placeholder = T.notePh;
      ta.value = notes[groupKey(g, gi)] || "";
      ta.dataset.gkey = groupKey(g, gi);
      ta.addEventListener("change", function () {
        var v = ta.value.trim();
        if (v) notes[ta.dataset.gkey] = v;
        else delete notes[ta.dataset.gkey];
        persist();
      });
      noteWrap.appendChild(ta);
      card.appendChild(noteWrap);

      pg.appendChild(card);
      wrap.appendChild(pg);
      pageEls.push(pg);
    });

    /* status-colored dots */
    var dots = document.getElementById("swDots");
    dots.innerHTML = "";
    dotEls = [];
    groups.forEach(function (g, gi) {
      var d = el("button", "sw-dot");
      d.type = "button";
      if (g.status === "failed") d.classList.add("sw-dot--bad");
      else if (g.status !== "clarify") d.classList.add("sw-dot--good");
      else d.classList.add("sw-dot--clarify");
      d.title = g.label || ("Worker " + gi);
      d.addEventListener("click", function () { showPage(gi); });
      dots.appendChild(d);
      dotEls.push(d);
    });
    dots.style.visibility = pageEls.length > 1 ? "visible" : "hidden";
    document.getElementById("swPrev").style.visibility = dots.style.visibility;
    document.getElementById("swNext").style.visibility = dots.style.visibility;

    showPage(page);

    document.getElementById("swSubmitBtn").textContent = notesSubmittedAt ? T.resubmit : T.submit;
    document.getElementById("swStatus").textContent = lastSaveError || (notesSubmittedAt ? T.submitted(fmtTime(notesSubmittedAt)) : "");
  }

  /* ---------- detail overlay ---------- */
  var detailEl = null;
  function detailRow(tag, text) {
    var r = el("div", "sw-row");
    r.appendChild(el("span", "sw-tag", tag));
    r.appendChild(el("p", null, text));
    return r;
  }
  function openDetail(g, it) {
    closeDetail();
    var d = el("div", "sw-detail");
    var head = el("div", "sw-detail-head");
    var back = el("button", "hs-button hs-button--quiet", T.back);
    back.type = "button";
    back.addEventListener("click", closeDetail);
    head.appendChild(back);
    head.appendChild(el("span", "sw-detail-ctx", (g.label || "") + " · #" + it.number));
    if (it.url && /^https?:\/\//i.test(it.url)) {
      var ext = el("a", "sw-detail-ext", "GitHub ↗");
      ext.href = it.url;
      ext.target = "_blank";
      ext.rel = "noopener";
      head.appendChild(ext);
    }
    d.appendChild(head);
    var body = el("div", "sw-detail-body");
    body.appendChild(el("h2", "sw-detail-title", it.title || ""));
    if (it.context) secParas(body, it.context, T.tagContext);
    if (it.body) secParas(body, it.body, T.tagBody);
    else if (it.problem) body.appendChild(detailRow(T.tagProblem, it.problem));
    if (g.status === "clarify" && it.missing) {
      body.appendChild(detailRow(T.tagMissing, it.missing));
    } else if (it.detail) {
      secParas(body, it.detail, T.tagDetail);
    } else if (it.solution) {
      body.appendChild(detailRow(T.tagSolution, it.solution));
    }
    d.appendChild(body);
    document.querySelector("main.hs-page").appendChild(d);
    detailEl = d;
  }
  function secParas(container, text, label) {
    var sec = el("div", "sw-sec");
    sec.appendChild(el("div", "sw-sec-label", label));
    String(text).split(/\n\s*\n/).forEach(function (p) {
      var t = p.trim();
      if (t) sec.appendChild(el("p", null, t));
    });
    container.appendChild(sec);
  }
  function closeDetail() {
    if (detailEl && detailEl.parentNode) detailEl.parentNode.removeChild(detailEl);
    detailEl = null;
  }

  document.getElementById("swPrev").addEventListener("click", function () { showPage(page - 1); });
  document.getElementById("swNext").addEventListener("click", function () { showPage(page + 1); });
  document.addEventListener("keydown", function (e) {
    if (detailEl) { if (e.key === "Escape") closeDetail(); return; }
    var t = e.target;
    if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT")) return;
    if (e.key === "ArrowLeft") showPage(page - 1);
    else if (e.key === "ArrowRight") showPage(page + 1);
  });

  /* ---------- submit ---------- */
  function payload() {
    var out = {
      title: snap.title || "",
      repo: snap.repo || "",
      rangeLabel: snap.rangeLabel || "",
      submittedAt: notesSubmittedAt,
      notes: []
    };
    groups.forEach(function (g, gi) {
      var v = notes[groupKey(g, gi)];
      if (v) out.notes.push({ group: g.label || ("Worker " + gi), note: v });
    });
    return out;
  }
  function plainText() {
    var p = payload();
    var lines = ["[" + (p.title || T.eyebrow) + "]"];
    p.notes.forEach(function (n) { lines.push("· " + n.group + " → " + n.note); });
    if (!p.notes.length) lines.push(lang === "zh" ? "（无批注）" : "(no notes)");
    return lines.join("\n");
  }
  var submitting = false;
  async function submit() {
    if (submitting) return;
    if (!caps.emit) { showCopy(); return; }
    var out = payload();
    var nextTime = new Date().toISOString();
    out.submittedAt = nextTime;
    out.instruction = "读取本事件来源卡片的真实分组、修复结果和逐组批注。先判断疑问、重查、返工或明确后续动作；仅处理点名范围。返工续接原工作树和执行实例，修后核实diff与测试再汇报。纯疑问先回答。本次提交不自动授权push、发布PR/review、merge、关闭Issue或删除工作树。示例卡不执行任务。遵守hana-coder的issues规程。";
    if (new TextEncoder().encode(JSON.stringify(out)).length > 8192) {
      document.getElementById("swStatus").textContent = "批注过长，请缩短后提交；内容已保留。";
      return;
    }
    submitting = true;
    document.getElementById("swSubmitBtn").disabled = true;
    try {
      var env = await window.card.emit("issue-swarm-notes", out);
      if (!env || !env.ok) {
        document.getElementById("swStatus").textContent = (env && env.error) || "提交失败，批注已保留，可重试。";
        return;
      }
      notesSubmittedAt = nextTime;
      await persist();
      render();
      if (caps.track) await window.card.track("issue-swarm-notes", { groups: groups.length, noted: out.notes.length });
    } finally {
      submitting = false;
      document.getElementById("swSubmitBtn").disabled = false;
    }
  }
  function showCopy() {
    document.getElementById("swFoot").classList.add("sw-hidden");
    document.getElementById("swCopyHint").textContent = T.copyHint;
    document.getElementById("swCopyText").value = plainText();
    document.getElementById("swCopyBtn").textContent = T.copy;
    document.getElementById("swCopyZone").classList.remove("sw-hidden");
  }
  document.getElementById("swSubmitBtn").addEventListener("click", submit);
  document.getElementById("swCopyBtn").addEventListener("click", function () {
    var ta = document.getElementById("swCopyText");
    var done = function () { document.getElementById("swCopyBtn").textContent = T.copied; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done, function () { ta.select(); });
    } else { ta.select(); }
  });

  /* ---------- frame fit: 4:3 in chat, fill when popped out ---------- */
  function fitFrame() {
    var w = document.documentElement.clientWidth || 0;
    var h = window.innerHeight || 0;
    var want = Math.max(400, Math.round(w * 0.75));
    var fill = h > want + 40;
    document.documentElement.classList.toggle("sw-fill", fill);
  }
  window.addEventListener("resize", fitFrame);

  boot();
  fitFrame();
})();
</script>
</body>
</html>
