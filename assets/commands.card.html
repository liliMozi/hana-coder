 class="hs-title">命令面板</h1><span class="repo" id="repoLabel">示例仓库</span></div><div class="stats"><span class="hs-badge hs-badge--pending" id="count"></span><span class="hs-badge hs-badge--pending" id="executionHint">逐条执行</span></div></header><section class="list" id="list"></section><form class="composer" id="composer"><input class="hs-input" id="request" placeholder="要什么命令？" aria-label="要什么命令？" maxlength="600" autocomplete="off"><button type="submit" class="hs-button hs-button--primary add" id="add" disabled>添加</button></form><p class="status" id="status" role="status"></p><button class="hs-button hs-button--quiet" id="cancelAdd" hidden>取消等待添加</button><footer class="foot"><span id="cwdLabel">执行目录：仓库根目录</span><span>新增命令由 Agent 执行</span></footer><p class="brand">HANA CODER · COMMANDS</p></div></main><script src="assets/commands-runtime.js"></script></body></html>
